name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'macos-latest' && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "mac-studio"]') || matrix.os }}
    env:
      CONDITION_GATES_BACKEND: sqlite
      CONDITION_GATES_DB: .pytest_temp/standalone-test.db
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-bin: .venv/bin/python
          - os: windows-latest
            python-bin: .venv/Scripts/python.exe
          - os: macos-latest
            python-bin: .venv/bin/python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          "${{ matrix.python-bin }}" -m pip install --upgrade pip
          "${{ matrix.python-bin }}" -m pip install -e ".[dev]" build

      - name: Validate Python syntax (compileall)
        run: |
          "${{ matrix.python-bin }}" -m compileall -q condition_gates tests

      - name: Lint with Ruff
        run: |
          "${{ matrix.python-bin }}" -m ruff check .

      - name: Run test suite
        run: |
          "${{ matrix.python-bin }}" -m pytest -ra -v

      - name: Build wheel and source distribution
        run: '"${{ matrix.python-bin }}" -m build'
