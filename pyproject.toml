[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "condition-gates"
version = "0.1.1"
description = "Bedingungen als nachprüfbare, sessionübergreifende Gates für LLM-Agenten"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger"},
]
keywords = [
    "ai", "agent", "orchestration", "gating", "preconditions", "workflow"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ellmos-ai/condition-gates"
Repository = "https://github.com/ellmos-ai/condition-gates.git"
Issues = "https://github.com/ellmos-ai/condition-gates/issues"
Changelog = "https://github.com/ellmos-ai/condition-gates/blob/main/CHANGELOG.md"
Organization = "https://github.com/ellmos-ai"
Umbrella = "https://github.com/open-bricks"
"Marketing Log" = "https://github.com/ellmos-ai/condition-gates/blob/main/MARKETING-LOG.txt"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
condition-gates = "condition_gates.cli:main"

[tool.setuptools.packages.find]
include = ["condition_gates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py310"
